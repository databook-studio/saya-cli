name: Release candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified archives with gh release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-native
          - os: windows-latest
            platform: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify source
        shell: bash
        run: |
          cargo fmt --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked -p saya-cli
      - name: Smoke test binary on Unix
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          BIN="target/release/saya"
          test -x "$BIN" || BIN="target/release/saya.exe"
          "$BIN" --version
          "$BIN" --non-interactive config doctor
      - name: Smoke test binary on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "target/release/saya.exe" --version
          & "target/release/saya.exe" --non-interactive config doctor
      - name: Package archive on Unix
        if: matrix.os != 'windows-latest'
        id: package
        shell: bash
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' crates/saya-cli/Cargo.toml | head -n 1)
          HOST=$(rustc -vV | sed -n 's/^host: //p')
          BIN="target/release/saya"
          test -f "$BIN" || BIN="target/release/saya.exe"
          STAGE="saya-${VERSION}-${HOST}"
          mkdir "$STAGE"
          cp "$BIN" "$STAGE/"
          cp README.md LICENSE SECURITY.md "$STAGE/"
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          if command -v shasum >/dev/null 2>&1; then shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"; else sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=${STAGE}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Package archive on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/saya-cli/Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          $host = (rustc -vV | Select-String '^host: ').ToString().Split(':')[1].Trim()
          $stage = "saya-$version-$host"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target/release/saya.exe,README.md,LICENSE,SECURITY.md $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $stage.zip" | Set-Content "$stage.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: saya-${{ matrix.platform }}
          path: |
            saya-*.tar.gz
            saya-*.tar.gz.sha256
            saya-*.zip
            saya-*.zip.sha256
          if-no-files-found: error

  checksums:
    name: Aggregate SHA-256 checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: saya-*
          merge-multiple: true
      - name: Verify and aggregate checksums
        run: |
          cd artifacts
          sidecars=$(find . -maxdepth 1 -type f -name '*.sha256' -print | sed 's#^./##' | LC_ALL=C sort)
          test -n "$sidecars"
          while IFS= read -r sidecar; do sha256sum -c "$sidecar"; done <<< "$sidecars"
          archives=$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print | sed 's#^./##' | LC_ALL=C sort)
          test -n "$archives"
          while IFS= read -r archive; do sha256sum -- "$archive"; done <<< "$archives" > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: saya-checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish verified release
    if: ${{ inputs.publish == true }}
    needs: [build, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: saya-*
          merge-multiple: true
      - name: Determine version
        id: version
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' crates/saya-cli/Cargo.toml | head -n 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish with gh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.version.outputs.version }}" release-assets/* --generate-notes
