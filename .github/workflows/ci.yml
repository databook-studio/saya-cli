name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI runners are ephemeral, so incremental compilation only adds overhead and
# bloats the restored cache; disable it workspace-wide. Build parallelism stays
# at the cargo default except where a job sets `CARGO_BUILD_JOBS: "1"` to keep
# a runner's memory bounded.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  # A file deleted in a later commit is still served by `git show <sha>:<path>`
  # on a plain clone, so internal-only material must never reach a public ref
  # in the first place. On a PR this checks the net diff, which is what a
  # squash merge actually contributes; on main it checks the whole history.
  internal-paths:
    name: No internal-only paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # history scan needs every commit, not a shallow tip
      - name: Check for internal-only paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            scripts/check-internal-paths.sh --diff "origin/${{ github.base_ref }}"
          else
            scripts/check-internal-paths.sh HEAD
          fi

  # Performance guards. Both arms run on this one runner, one after the other:
  # the control is the latest published linux x86_64 release binary, the
  # candidate is this pull request built in release, and `scripts/perf-compare.sh`
  # applies the bars — first message within control + 10 %, steady turn overhead
  # p50 ≤ 50 ms and p95 ≤ 120 ms, idle TUI CPU ≤ 1 %, draws ≤ 30/s — so a
  # request-size or overhead regression fails the pull request that causes it.
  # With no release published yet there is nothing to compare against: the job
  # says so and passes, and starts guarding from the next release.
  perf-compare:
    name: Perf against the latest release
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: "perf-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Download the latest published release (control)
        id: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/tmp-control
          # No release at all is an error from the API, not an empty list: both
          # shapes mean the same thing here — there is nothing to compare with.
          latest=$(gh api "repos/${{ github.repository }}/releases/latest" 2>/dev/null || true)
          asset=""
          if [ -n "$latest" ]; then
            asset=$(printf '%s' "$latest" | \
              jq -r '[.assets[].name | select(test("x86_64-unknown-linux-gnu[.]tar[.]gz$"))] | first // ""')
          fi
          if [ -z "$asset" ]; then
            echo "::notice::No published linux x86_64 release binary yet — the control arm is skipped, so this job has nothing to compare. It starts guarding from the next published release."
            exit 0
          fi
          gh release download --repo "${{ github.repository }}" \
            --pattern "$asset" --pattern "$asset.sha256" --dir target/tmp-control
          if [ -f "target/tmp-control/$asset.sha256" ]; then
            (cd target/tmp-control && sha256sum -c "$asset.sha256")
          fi
          tar -xzf "target/tmp-control/$asset" -C target/tmp-control
          bin=$(find target/tmp-control -maxdepth 2 -type f -name saya -perm -u+x | head -n 1)
          test -n "$bin"
          echo "binary=$(realpath "$bin")" >> "$GITHUB_OUTPUT"
      - name: Build the candidate (release)
        if: steps.control.outputs.binary != ''
        run: cargo build --release --locked -p saya-cli --bin saya
      - name: Compare the two arms
        if: steps.control.outputs.binary != ''
        run: bash scripts/perf-compare.sh "${{ steps.control.outputs.binary }}" target/release/saya 5
      - name: Upload the comparison
        if: always() && steps.control.outputs.binary != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-compare
          path: target/perf/compare.md
          if-no-files-found: warn

  # Pure file inspection: no network, no secrets, no compile. Runs on every PR
  # so the release-workflow contract cannot drift between releases.
  release-workflow:
    name: Release workflow contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash scripts/check-release-workflow.sh

  # Enforces the 250-line source file cap for the exact index contents.
  source-file-length:
    name: Source file length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m unittest discover -s scripts/tests/file_limits -t scripts/tests/file_limits
      - run: python3 scripts/check_file_limits.py --view index

  msrv:
    name: Rust 1.89 MSRV
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.89.0
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: "msrv-1.89"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked

  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      # Serialized: parallel codegen has exhausted a runner's memory before.
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: "stable-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # nextest runs the test binaries; a separate --doc pass covers doctests, which
      # nextest does not execute. Together these match the old `cargo test` coverage.
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --doc --locked

  # Fast feedback for Windows job-harness fixes. The full verify matrix builds
  # the whole workspace serially and takes ~40 min on windows-latest, which is
  # far too slow to iterate against. This job builds only what the job e2e
  # test drives and is intentionally not a required check: verify still owns
  # the release gate.
  windows-job-e2e:
    name: windows job e2e
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Two-way codegen keeps the runner's memory bounded without serializing.
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: "e2e-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest
      - run: cargo nextest run -p saya-cli --locked --profile ci --test job_apply_e2e --test chat_session_line_e2e

  postgres-live:
    name: PostgreSQL live contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SAYA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: "stable-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p saya-connectors --test postgres_live
      # The native parameter-binding tests are lib tests
      # (postgres::execute::tests::…), not part of the postgres_live binary, so
      # the step above never executes them. Run them here against the same
      # service and refuse a silent skip: fail when SAYA_TEST_POSTGRES_URL is
      # unset (the test returns early and passes) or when the filter does not
      # run exactly one test.
      - name: Native parameter binding (lib)
        run: |
          set -euo pipefail
          if [ -z "${SAYA_TEST_POSTGRES_URL:-}" ]; then
            echo "SAYA_TEST_POSTGRES_URL is unset: the binding test would return early and pass" >&2
            exit 1
          fi
          output=$(cargo test --locked -p saya-connectors --lib \
            live_postgres_binds_typed_parameters_natively 2>&1) \
            || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          passed=$(printf '%s\n' "$output" | sed -nE 's/^test result: [A-Za-z]+\. ([0-9]+) passed;.*/\1/p' | tail -n1)
          if [ "${passed:-0}" -ne 1 ]; then
            echo "expected exactly 1 binding test to run, got ${passed:-0}" >&2
            exit 1
          fi

  mysql-live:
    name: MySQL live contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_USER: saya
          MYSQL_PASSWORD: saya
          MYSQL_DATABASE: warehouse
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
    env:
      SAYA_TEST_MYSQL_URL: mysql://saya:saya@127.0.0.1:3306/warehouse?ssl-mode=disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: "stable-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p saya-connectors --test mysql_live
      # The native parameter-binding tests are lib tests
      # (mysql::execute::tests::…), not part of the mysql_live binary, so the
      # step above never executes them. Run them here against the same service
      # and refuse a silent skip: fail when SAYA_TEST_MYSQL_URL is unset (the
      # test returns early and passes) or when the filter does not run exactly
      # one test.
      - name: Native parameter binding (lib)
        run: |
          set -euo pipefail
          if [ -z "${SAYA_TEST_MYSQL_URL:-}" ]; then
            echo "SAYA_TEST_MYSQL_URL is unset: the binding test would return early and pass" >&2
            exit 1
          fi
          output=$(cargo test --locked -p saya-connectors --lib \
            live_mysql_binds_typed_parameters_natively 2>&1) \
            || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          passed=$(printf '%s\n' "$output" | sed -nE 's/^test result: [A-Za-z]+\. ([0-9]+) passed;.*/\1/p' | tail -n1)
          if [ "${passed:-0}" -ne 1 ]; then
            echo "expected exactly 1 binding test to run, got ${passed:-0}" >&2
            exit 1
          fi
