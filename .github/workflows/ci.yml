name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runners are ephemeral, so incremental compilation only adds overhead and
# bloats the restored cache; disable it workspace-wide. Build parallelism is
# left at the cargo default (all logical CPUs) instead of being throttled to a
# single job, which serialized the ~1,800-file bundled DuckDB C++ compile.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  # A file deleted in a later commit is still served by `git show <sha>:<path>`
  # on a plain clone, so internal-only material must never reach a public ref
  # in the first place. On a PR this checks the net diff, which is what a
  # squash merge actually contributes; on main it checks the whole history.
  internal-paths:
    name: No internal-only paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # history scan needs every commit, not a shallow tip
      - name: Check for internal-only paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            scripts/check-internal-paths.sh --diff "origin/${{ github.base_ref }}"
          else
            scripts/check-internal-paths.sh HEAD
          fi

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.88.0
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "msrv-1.88"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --locked

  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "stable-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest
      - run: cargo fmt --check
      # nextest runs the test binaries; a separate --doc pass covers doctests, which
      # nextest does not execute. Together these match the old `cargo test` coverage.
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  postgres-live:
    name: PostgreSQL live contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      SAYA_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "stable-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p saya-connectors --test postgres_live

  mysql-live:
    name: MySQL live contract
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_USER: saya
          MYSQL_PASSWORD: saya
          MYSQL_DATABASE: warehouse
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306
    env:
      SAYA_TEST_MYSQL_URL: mysql://saya:saya@127.0.0.1:3306/warehouse?ssl-mode=disabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: "stable-${{ runner.os }}"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p saya-connectors --test mysql_live
