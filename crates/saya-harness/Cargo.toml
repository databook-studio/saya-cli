[package]
name = "saya-harness"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Run engine for SAYA: run directories, paths, and the single-writer lock."

[lints]
workspace = true

[dependencies]
saya-agent = { path = "../saya-agent", version = "0.5.1" }
# The credential-shape table and the vetted read-only command set are config's
# trusted policy; the harness reads them rather than keeping a second copy.
saya-config = { path = "../saya-config", version = "0.5.1" }
saya-store = { path = "../saya-store", version = "0.5.1" }
saya-types = { path = "../saya-types", version = "0.5.1" }
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
futures-util.workspace = true
gix-ignore.workspace = true
globset.workspace = true
regex.workspace = true
# The production FetchTransport. The workspace entry carries
# `default-features = false` with rustls-tls, so no second TLS stack arrives.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
unicode-normalization.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest.workspace = true
sqlx.workspace = true
saya-connectors = { path = "../saya-connectors", version = "0.5.1" }
