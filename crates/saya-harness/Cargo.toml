[package]
name = "saya-harness"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Run engine for SAYA: run directories, paths, and the single-writer lock."

[dependencies]
saya-agent = { path = "../saya-agent", version = "0.4.1" }
saya-store = { path = "../saya-store", version = "0.4.1" }
saya-types = { path = "../saya-types", version = "0.4.1" }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
duckdb.workspace = true
futures-util.workspace = true
# The production FetchTransport. The workspace entry carries
# `default-features = false` with rustls-tls, so no second TLS stack arrives.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlparser.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest.workspace = true
saya-connectors = { path = "../saya-connectors", version = "0.4.1" }
