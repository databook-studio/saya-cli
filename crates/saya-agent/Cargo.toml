[package]
name = "saya-agent"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Agentic LLM loop and OpenAI-compatible provider clients for SAYA CLI."

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
saya-types = { path = "../saya-types", version = "0.5.2" }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
# `start_paused` lets the loop's two-minute content-progress window be
# asserted without spending two minutes (tests/agent_loop).
tokio = { workspace = true, features = ["test-util"] }
