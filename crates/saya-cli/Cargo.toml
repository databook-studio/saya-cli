[package]
name = "saya-cli"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Database-aware AI agent for the terminal: full-screen TUI, schema discovery, and bounded read-only SQL over PostgreSQL, MySQL, DuckDB, and Snowflake."
readme = "../../README.md"
homepage = "https://github.com/databook-studio/saya-cli"
keywords = ["database", "sql", "ai", "agent", "tui"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "saya"
path = "src/main.rs"

# cargo-binstall: download the prebuilt binary from GitHub Releases instead of
# compiling. Archive layout: saya-<version>-<target>/{saya, README.md, ...}.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/saya-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "saya-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
async-trait.workspace = true
clap.workspace = true
saya-agent = { path = "../saya-agent", version = "0.1.2" }
saya-config = { path = "../saya-config", version = "0.1.2" }
saya-connectors = { path = "../saya-connectors", version = "0.1.2" }
saya-store = { path = "../saya-store", version = "0.1.2" }
saya-types = { path = "../saya-types", version = "0.1.2" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true
ratatui.workspace = true

[dev-dependencies]
duckdb.workspace = true
libc = "0.2"
