[package]
name = "saya-cli"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Database-aware AI agent for the terminal: full-screen TUI, schema discovery, and bounded read-only SQL over PostgreSQL, MySQL, SQLite, and Snowflake."
readme = "../../README.md"
homepage = "https://github.com/databook-studio/saya-cli"
keywords = ["database", "sql", "ai", "agent", "tui"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "saya"
path = "src/main.rs"

# cargo-binstall: download the prebuilt binary from GitHub Releases instead of
# compiling. Archive layout: saya-<version>-<target>/{saya, README.md, ...}.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/saya-{ version }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "saya-{ version }-{ target }/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
clap.workspace = true
clap_complete = "4"
futures-util.workspace = true
saya-agent = { path = "../saya-agent", version = "0.5.1" }
saya-config = { path = "../saya-config", version = "0.5.1" }
saya-connectors = { path = "../saya-connectors", version = "0.5.1" }
saya-harness = { path = "../saya-harness", version = "0.5.1" }
saya-store = { path = "../saya-store", version = "0.5.1" }
saya-types = { path = "../saya-types", version = "0.5.1" }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
sha2.workspace = true
chrono.workspace = true
ratatui.workspace = true
# MCP stdio server (ADR 0008): pinned exactly, minimal features — `server`
# (handler + service, which carries schemars transitively) and `transport-io`
# (the stdio transport). No macros: the handler is hand-written.
rmcp.workspace = true
base64.workspace = true
url.workspace = true
terminal-colorsaurus.workspace = true
# Transcript wrapping measures display cells and breaks on grapheme bounds.
# Both are already in Cargo.lock (transitive via ratatui); these pins add no
# new supply chain.
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
libc = "0.2"
insta.workspace = true
proptest.workspace = true
# Owning temp directories that clean up on drop: the line front's end-to-end
# rows (tests/chat_session_line_e2e.rs) hold a SQLite fixture, and a cross-
# platform test cannot assume the shell's temp paths survive. Already in
# Cargo.lock (dev-only through saya-connectors); this pin adds no supply chain.
tempfile = "3"
# Pty + screen parser for the TUI paint smoke test (tests/tui_pty_smoke.rs).
# Dev-only: nothing here is a runtime dependency. portable-pty allocates a
# pseudo-terminal so the real `saya` binary drives its crossterm/ratatui TUI
# against a real TTY (not the headless pipe path); vt100 parses the resulting
# byte stream into a grid we can read as text and assert against.
portable-pty = "0.9"
vt100 = "0.16"
# The approval wait's policies are tested on a paused clock
# (`#[tokio::test(start_paused = true)]` + `tokio::time::advance`), so a test
# never really waits the panel's 120 s. Dev-only: `test-util` reaches no
# shipped binary.
tokio = { workspace = true, features = ["test-util"] }
