[package]
name = "saya-cli"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Database-aware AI agent for the terminal: full-screen TUI, schema discovery, and bounded read-only SQL over PostgreSQL, MySQL, DuckDB, and Snowflake."
readme = "../../README.md"
homepage = "https://github.com/databook-studio/saya-cli"
keywords = ["database", "sql", "ai", "agent", "tui"]
categories = ["command-line-utilities", "database"]

[[bin]]
name = "saya"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
clap.workspace = true
saya-agent = { path = "../saya-agent" }
saya-config = { path = "../saya-config" }
saya-connectors = { path = "../saya-connectors" }
saya-store = { path = "../saya-store" }
saya-types = { path = "../saya-types" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
sha2.workspace = true
ratatui.workspace = true

[dev-dependencies]
duckdb.workspace = true
libc = "0.2"
