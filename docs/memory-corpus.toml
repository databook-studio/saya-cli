# Memory Corpus — Measurement cases for evaluating whether structurally observable slots bind.
#
# Classification Rule for `schema_objection_class`:
# What would the schema alone — nullability, type, cardinality — tell a competent analyst who knows nothing about the business?
# - schema_compatible: Nothing in the schema argues against the claim.
# - schema_ambiguous:  The schema admits the claim and a plausible alternative equally.
# - schema_suspicious: The schema gives a concrete reason to doubt it (e.g. the claimed time column is nullable, so counting by it drops rows).
# - schema_invalid:    The schema contradicts it outright (e.g. column or table does not exist).
#
# This is classified blind, before results exist. Inferring "the model had grounds" after seeing whether it complied is the post-hoc rationalisation the class exists to prevent.

[[cases]]
case_id = "dt-rental-return-date"
slot_kind = "default_time_column"
object = "pagila.public.rental"
claim = "return_date"
prompts = [
    "How many rentals were there by month in 2022?",
    "Show monthly rental volume for 2022",
    "Monthly rental count trend over 2022",
]
oracle_kind = "default_time_column"
expected = "return_date"
schema_objection_class = "schema_suspicious"

