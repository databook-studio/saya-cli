[workspace]
members = [
  "crates/saya-types",
  "crates/saya-config",
  "crates/saya-connectors",
  "crates/saya-agent",
  "crates/saya-store",
  "crates/saya-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/databook-studio/saya-cli"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
toml = "0.8"
